
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    <form id="loginForm">

        <label>Username</label>
        <input
            type="text"
            id="username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>


<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        try {

            const response = await fetch(
                "/api/login/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

            const data = await response.json();
            console.log("LOGIN RESPONSE:", data);

            if (response.ok) {

                message.innerText = "Login successful!";

                if (data.role === "student") {
                    window.location.href ="/api/student-dashboard/?student_id=" + data.student_id;
                }
                
                else if (data.role === "trainer") {

                    window.location.href =
                        "/api/trainer-dashboard/";

                }
                else if (data.role === "admin") {

                    window.location.href =
                        "/admin-dashboard/";

                }

            }
            else {

                message.innerText =
                    data.error || "Invalid username or password";

            }

        }
        catch (error) {

            message.innerText =
                "Unable to connect to server.";

            console.error(error);

        }

    }
);

</script>

</body>
</html>
